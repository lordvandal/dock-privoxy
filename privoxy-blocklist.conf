# Config of privoxy-blocklist

# array of URL for AdblockPlus lists
#  for more sources just add it within the round brackets
URLS=("https://easylist-downloads.adblockplus.org/easylist.txt" "https://easylist-downloads.adblockplus.org/easyprivacy.txt" "https://easylist-downloads.adblockplus.org/easylistgermany.txt" "https://easylist-downloads.adblockplus.org/easylistchina.txt" "https://easylist-downloads.adblockplus.org/advblock.txt" "https://zoso.ro/pages/rolist.txt" "https://easylist-downloads.adblockplus.org/antiadblockfilters.txt" "https://easylist-downloads.adblockplus.org/abp-filters-anti-cv.txt" "https://secure.fanboy.co.nz/r/fanboy-ultimate.txt" "https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-domains-ACTIVE.adblock" )

# array of content filters to convert
#   for supported values check: ./privoxy-blocklist.sh -h
#   empty by default to deactivate as content filters slowdown privoxy a lot
FILTERS=("" )

# config for privoxy initscript providing PRIVOXY_CONF, PRIVOXY_USER and PRIVOXY_GROUP
INIT_CONF="/etc/conf.d/privoxy"

# !! set these when config INIT_CONF doesn't exist and default values do not match your system !!
# !! These values will be overwritten by INIT_CONF when exists !!
PRIVOXY_USER="privoxy"
PRIVOXY_GROUP="root"
PRIVOXY_CONF="/etc/privoxy/config"

# name for lock file (default: script name)
TMPNAME="$(basename "$(readlink -f "${0}")")"
# directory for temporary files
TMPDIR="/tmp/${TMPNAME}"

# Debug-level
#   -1 = quiet
#    0 = normal
#    1 = verbose
#    2 = more verbose (debugging)
#    3 = incredibly loud (function debugging)
DBG=0
